<svg xmlns="http://www.w3.org/2000/svg" width="590" height="236" viewBox="0 0 590 236" role="img" aria-label="GMC Smart Parking — Real-time parking discovery, reservation and navigation with camera-based detection, for Gelephu Mindfulness City.">
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}.cycle text{opacity:1}.cycle text:not(:first-child){display:none}}

.sheen{animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-700px)}100%{transform:translateX(700px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>

<defs>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#2FBF71" stop-opacity=".22"/><stop offset=".6" stop-color="#2FBF71" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="590" height="236" rx="16"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="590" height="236" fill="#0F1522"/>
<rect width="590" height="236" fill="url(#gl)"/>
<rect class="sheen" x="0" y="0" width="300" height="236" fill="url(#sh)"/>
<rect x="0" y="0" width="4" height="236" fill="#2FBF71"/>
</g>
<rect x=".5" y=".5" width="589" height="235" rx="16" fill="none" stroke="#1E2738"/>
<text x="28" y="44" class="mono" font-size="12" letter-spacing="2" fill="#2FBF71">PELSUNG COHORT 2</text>

<text x="28" y="82" class="sans" font-size="27" font-weight="780" letter-spacing="-.5" fill="#EAEFF7">GMC Smart Parking</text>
<text x="28" y="112" class="sans" font-size="15" fill="#8A95A8">Real-time parking discovery, reservation and navigation</text><text x="28" y="134" class="sans" font-size="15" fill="#8A95A8">with camera-based detection, for Gelephu Mindfulness City.</text>
<g transform="translate(28.0 182)"><rect width="133.0" height="28" rx="14" fill="#2FBF71" fill-opacity=".10" stroke="#2FBF71" stroke-opacity=".35"/><text x="66.5" y="18.5" text-anchor="middle" class="mono" font-size="12.5" fill="#2FBF71">Computer Vision</text></g><g transform="translate(169.0 182)"><rect width="96.0" height="28" rx="14" fill="#2FBF71" fill-opacity=".10" stroke="#2FBF71" stroke-opacity=".35"/><text x="48.0" y="18.5" text-anchor="middle" class="mono" font-size="12.5" fill="#2FBF71">Full-stack</text></g>
<g transform="translate(562 202)"><circle cx="-8" cy="-6" r="4" fill="#2FBF71" class="pulse"/></g>
<text x="546" y="201" text-anchor="end" class="mono" font-size="12.5" fill="#5B6578">pelsung cohort 2</text>

</svg>
