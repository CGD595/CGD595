<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="7+ Projects shipped, 500K BTN pre-seed, 4 Bhutanese dialects, ~40% RAG retrieval gain"><style>@font-face{font-family:CGDh;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:CGDm;src:url(data:font/woff;base64,) format('woff')}
