<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="86" viewBox="0 0 1200 86" role="img" aria-label="Journey">
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}.cycle text{opacity:1}.cycle text:not(:first-child){display:none}}

.fl{transform-box:fill-box;transform-origin:50% 0;animation:sw 3.2s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.grow{transform-origin:0 50%;animation:grow 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<rect width="1200" height="86" rx="12" fill="#0A0E17"/>
<g transform="translate(24 30)"><rect x="0" y="0" width="10" height="16" rx="1.5" fill="#3E8BFF" class="fl" style="animation-delay:0.0s"/><rect x="14" y="0" width="10" height="16" rx="1.5" fill="#E9EEF6" class="fl" style="animation-delay:-0.3s"/><rect x="28" y="0" width="10" height="16" rx="1.5" fill="#F0524F" class="fl" style="animation-delay:-0.6s"/><rect x="42" y="0" width="10" height="16" rx="1.5" fill="#2FBF71" class="fl" style="animation-delay:-0.9s"/><rect x="56" y="0" width="10" height="16" rx="1.5" fill="#F6B940" class="fl" style="animation-delay:-1.2s"/></g>
<text x="108" y="45" class="mono" font-size="14" letter-spacing="2" fill="#F6B940">02</text>
<text x="148" y="47" class="sans" font-size="30" font-weight="750" letter-spacing="-.5" fill="#EAEFF7">Journey</text>
<text x="148" y="72" class="sans" font-size="15" fill="#8A95A8">Where I've been shipping</text>
<rect x="20" y="84" width="1192" height="1" fill="#1E2738" class="grow"/>

</svg>
