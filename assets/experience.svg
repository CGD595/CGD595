<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Experience timeline">
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}.cycle text{opacity:1}.cycle text:not(:first-child){display:none}}

.row{animation:in .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.spine{transform-origin:0 0;animation:spine 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes spine{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.6}to{transform:scale(2.6);opacity:0}}
</style>
<rect x=".5" y=".5" width="1199" height="469" rx="16" fill="#0F1522" stroke="#1E2738"/>
<rect x="61" y="44" width="2" height="344" fill="#1E2738" class="spine"/>
<g class="row" style="animation-delay:0.20s">
<circle cx="62" cy="44" r="7" fill="#3E8BFF" class="ping"/><circle cx="62" cy="44" r="7" fill="#0F1522" stroke="#3E8BFF" stroke-width="3"/>
<text x="96" y="50" class="sans" font-size="19" font-weight="700" fill="#EAEFF7">Software Engineer <tspan fill="#5B6578" font-weight="400">at</tspan> <tspan fill="#3E8BFF">21Tech</tspan></text>
<text x="96" y="76" class="sans" font-size="15" fill="#8A95A8">Software, mobile &amp; web systems for national and enterprise clients.</text>
