<g class="fade" style="animation-delay:.1s"><circle class="dot" cx="68" cy="107" r="4" fill="#014226"/>
<text x="84.0" y="112.0" class="m" font-size="15" fill="#707070" letter-spacing="0.18em">KUZU ZANGPO · BHUTAN · AI-FOCUSED FULL-STACK ENGINEER</text></g>
<g clip-path="url(#l0)"><g class="line" style="animation-delay:0.28s"><text x="60.0" y="251.1" class="h" font-size="136.6" fill="#0F0F0F" letter-spacing="-0.045em">CHIME</text></g></g>
<g clip-path="url(#l1)"><g class="line" style="animation-delay:0.41s"><text x="60.0" y="368.6" class="h" font-size="136.6" fill="#0F0F0F" letter-spacing="-0.045em">GYELTSHEN</text></g></g>
