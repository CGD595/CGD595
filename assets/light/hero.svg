<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Chime Gyeltshen Dorji — AI-focused full-stack engineer, Bhutan"><style>@font-face{font-family:CGDh;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:CGDm;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:CGDb;src:url(data:font/woff;base64,) format('woff')}
text{font-kerning:none;text-rendering:geometricPrecision}
.h{font-family:CGDh,'Space Grotesk',system-ui,sans-serif}
.m{font-family:CGDm,'Space Grotesk',system-ui,sans-serif}
.b{font-family:CGDb,Roboto,system-ui,sans-serif}
.sweep{animation:sweep 9s cubic-bezier(.22,1,.36,1) infinite both}
@keyframes sweep{0%{transform:translateX(-260px)}55%,100%{transform:translateX(1500px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.sweep{display:none}}

.blind{animation:breathe ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.75}}
.aurora{transform-box:fill-box;transform-origin:center;animation:aur 10s ease-in-out infinite}
@keyframes aur{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.04);opacity:1}}
.line{animation:up .95s cubic-bezier(.22,1,.36,1) both}
@keyframes up{from{transform:translateY(150px)}to{transform:none}}
.fade{animation:fade .6s cubic-bezier(.22,1,.36,1) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bob{animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(5px)}}
.dot{animation:dot 2.4s ease-in-out infinite}@keyframes dot{0%,100%{opacity:1}50%{opacity:.3}}
</style><defs><radialGradient id="au" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2FB57A" stop-opacity="0.16"/><stop offset=".6" stop-color="#2FB57A" stop-opacity="0.064"/><stop offset="1" stop-color="#2FB57A" stop-opacity="0"/></radialGradient><linearGradient id="bl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#014226" stop-opacity="0"/><stop offset=".4" stop-color="#014226" stop-opacity="0.05"/><stop offset=".6" stop-color="#014226" stop-opacity="0.05"/><stop offset="1" stop-color="#014226" stop-opacity="0"/></linearGradient><clipPath id="fr"><rect width="1200" height="600" rx="20"/></clipPath><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#014226" stop-opacity="0"/><stop offset=".5" stop-color="#014226" stop-opacity="0.06"/><stop offset="1" stop-color="#014226" stop-opacity="0"/></linearGradient><clipPath id="l0"><rect x="0" y="141.8" width="800" height="117.5"/></clipPath><clipPath id="l1"><rect x="0" y="259.3" width="800" height="117.5"/></clipPath><clipPath id="l2"><rect x="0" y="376.8" width="800" height="117.5"/></clipPath></defs>
