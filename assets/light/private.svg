<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="606" viewBox="0 0 1200 606" role="img" aria-label="Private work: Agentic RAG for investigators; A national app, rebuilt; Camera-based smart parking; Handwritten Dzongkha OCR; On-chain wallet analytics"><style>@font-face{font-family:CGDh;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:CGDm;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:CGDb;src:url(data:font/woff;base64,) format('woff')}
