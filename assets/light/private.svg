<text x="72.0" y="291.0" class="h" font-size="24" fill="#0F0F0F" letter-spacing="-0.02em">Camera-based smart parking</text>
<text x="72.0" y="320.0" class="b" font-size="17" fill="#707070">Real-time discovery, reservation and routing for a new city, built inside a national innovation cohort.</text>
