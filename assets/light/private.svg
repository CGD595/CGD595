<text x="72.0" y="173.0" class="h" font-size="24" fill="#0F0F0F" letter-spacing="-0.02em">A national app, rebuilt</text>
<text x="72.0" y="202.0" class="b" font-size="17" fill="#707070">Redesigning and rebuilding a Bhutan-focused app end to end on Kotlin Multiplatform, SwiftUI and Compose.</text>
