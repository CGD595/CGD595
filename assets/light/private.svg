<text x="72.0" y="409.0" class="h" font-size="24" fill="#0F0F0F" letter-spacing="-0.02em">Handwritten Dzongkha OCR</text>
<text x="72.0" y="438.0" class="b" font-size="17" fill="#707070">Crowdsourced dataset with intake, labelling, dedup and QA, plus an OCR model trained on the result.</text>
