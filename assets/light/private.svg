<text x="72.0" y="55.0" class="h" font-size="24" fill="#0F0F0F" letter-spacing="-0.02em">Agentic RAG for investigators</text>
<text x="72.0" y="84.0" class="b" font-size="17" fill="#707070">Reads handwritten case files through a 3-layer OCR pipeline, reasons across evidence with a multi-tool agent</text>
<text x="72.0" y="109.0" class="b" font-size="17" fill="#707070">and points to the exact pixel behind every answer. Fully on-prem, zero cloud.</text>
