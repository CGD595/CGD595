<svg xmlns="http://www.w3.org/2000/svg" width="590" height="236" viewBox="0 0 590 236" role="img" aria-label="ACC Document Intelligence — Reads handwritten investigative files via 3-layer OCR, a LangGraph multi-tool agent, Text2SQL cross-referencing and VLM answer highlighting. Zero cloud.">
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}.cycle text{opacity:1}.cycle text:not(:first-child){display:none}}

.sheen{animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-700px)}100%{transform:translateX(700px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>

<defs>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#3E8BFF" stop-opacity=".22"/><stop offset=".6" stop-color="#3E8BFF" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="590" height="236" rx="16"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="590" height="236" fill="#0F1522"/>
<rect width="590" height="236" fill="url(#gl)"/>
<rect class="sheen" x="0" y="0" width="300" height="236" fill="url(#sh)"/>
<rect x="0" y="0" width="4" height="236" fill="#3E8BFF"/>
</g>
<rect x=".5" y=".5" width="589" height="235" rx="16" fill="none" stroke="#1E2738"/>
<text x="28" y="44" class="mono" font-size="12" letter-spacing="2" fill="#3E8BFF">AGENTIC RAG · AIR-GAPPED</text>
<g transform="translate(408.8 26)"><rect width="153.2" height="26" rx="13" fill="#F6B940" fill-opacity=".14"/><text x="76.6" y="17.5" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#F6B940">BEST PROJECT 2026</text></g>
<text x="28" y="82" class="sans" font-size="27" font-weight="780" letter-spacing="-.5" fill="#EAEFF7">ACC Document Intelligence</text>
<text x="28" y="112" class="sans" font-size="15" fill="#8A95A8">Reads handwritten investigative files via 3-layer OCR, a</text><text x="28" y="134" class="sans" font-size="15" fill="#8A95A8">LangGraph multi-tool agent, Text2SQL cross-referencing and</text><text x="28" y="156" class="sans" font-size="15" fill="#8A95A8">VLM answer highlighting. Zero cloud.</text>
<g transform="translate(28.0 182)"><rect width="73.8" height="28" rx="14" fill="#3E8BFF" fill-opacity=".10" stroke="#3E8BFF" stroke-opacity=".35"/><text x="36.9" y="18.5" text-anchor="middle" class="mono" font-size="12.5" fill="#3E8BFF">Llama 3</text></g><g transform="translate(109.8 182)"><rect width="88.6" height="28" rx="14" fill="#3E8BFF" fill-opacity=".10" stroke="#3E8BFF" stroke-opacity=".35"/><text x="44.3" y="18.5" text-anchor="middle" class="mono" font-size="12.5" fill="#3E8BFF">LangGraph</text></g><g transform="translate(206.4 182)"><rect width="81.2" height="28" rx="14" fill="#3E8BFF" fill-opacity=".10" stroke="#3E8BFF" stroke-opacity=".35"/><text x="40.6" y="18.5" text-anchor="middle" class="mono" font-size="12.5" fill="#3E8BFF">ChromaDB</text></g><g transform="translate(295.6 182)"><rect width="73.8" height="28" rx="14" fill="#3E8BFF" fill-opacity=".10" stroke="#3E8BFF" stroke-opacity=".35"/><text x="36.9" y="18.5" text-anchor="middle" class="mono" font-size="12.5" fill="#3E8BFF">FastAPI</text></g>
<g transform="translate(562 202)"><circle cx="-8" cy="-6" r="4" fill="#3E8BFF" class="pulse"/></g>
<text x="546" y="201" text-anchor="end" class="mono" font-size="12.5" fill="#5B6578">confidential</text>

</svg>
