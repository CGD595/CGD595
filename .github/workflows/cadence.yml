name: Shipping cadence

on:
  schedule:
    - cron: "17 0 * * *" # daily, 06:17 Bhutan time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cadence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.55.3
      - name: Redraw cadence from contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/cadence.py "$GITHUB_REPOSITORY_OWNER"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dark/cadence.svg assets/light/cadence.svg
          git diff --cached --quiet || git commit -m "chore: redraw shipping cadence"
          git push
