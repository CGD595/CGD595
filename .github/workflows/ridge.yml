name: Contribution Himalaya

on:
  schedule:
    - cron: "17 0 * * *" # daily, 06:17 Bhutan time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Redraw mountains from contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ridge.py ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ridge.svg
          git diff --cached --quiet || git commit -m "chore: redraw contribution himalaya"
          git push
