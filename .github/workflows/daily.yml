name: Daily profile

on:
  schedule:
    - cron: "17 0 * * *" # daily, 06:17 Bhutan time (forecasts only count if issued before 09:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.55.3
      - name: Forecast and redraw from contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/forecast.py "$GITHUB_REPOSITORY_OWNER"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast-log.json assets/dark/weather.svg assets/light/weather.svg
          git diff --cached --quiet || git commit -m "chore: daily shipping forecast"
          git push
